<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="WeChat QR placeholder">
  <rect width="220" height="220" fill="#ffffff"/>
  <g fill="#1a1a1a">
    <!-- three finder patterns, the QR's unmistakable corners -->
    <g>
      <rect x="20" y="20" width="48" height="48"/><rect x="28" y="28" width="32" height="32" fill="#ffffff"/><rect x="36" y="36" width="16" height="16"/>
    </g>
    <g>
      <rect x="152" y="20" width="48" height="48"/><rect x="160" y="28" width="32" height="32" fill="#ffffff"/><rect x="168" y="36" width="16" height="16"/>
    </g>
    <g>
      <rect x="20" y="152" width="48" height="48"/><rect x="28" y="160" width="32" height="32" fill="#ffffff"/><rect x="36" y="168" width="16" height="16"/>
    </g>
    <!-- a scatter of modules: visibly QR-shaped, deliberately not a real code -->
    <rect x="88" y="24" width="12" height="12"/><rect x="112" y="24" width="12" height="12"/><rect x="88" y="48" width="12" height="12"/>
    <rect x="124" y="60" width="12" height="12"/><rect x="88" y="84" width="12" height="12"/><rect x="136" y="96" width="12" height="12"/>
    <rect x="24" y="88" width="12" height="12"/><rect x="48" y="100" width="12" height="12"/><rect x="72" y="88" width="12" height="12"/>
    <rect x="100" y="112" width="12" height="12"/><rect x="160" y="88" width="12" height="12"/><rect x="184" y="112" width="12" height="12"/>
    <rect x="88" y="152" width="12" height="12"/><rect x="112" y="164" width="12" height="12"/><rect x="136" y="152" width="12" height="12"/>
    <rect x="160" y="176" width="12" height="12"/><rect x="100" y="184" width="12" height="12"/><rect x="184" y="152" width="12" height="12"/>
  </g>
  <text x="110" y="216" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">placeholder</text>
</svg>
